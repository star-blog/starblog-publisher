name: Tests
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      STARBLOGPUBLISHER_SETTINGS_PATH: ${{ github.workspace }}/output/ci-settings/settings.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test StarBlogPublisher.Tests/StarBlogPublisher.Tests.csproj -c Release --logger "trx;LogFileName=tests.trx" --results-directory output/test-results
      - name: Compile desktop regression runner (does not open a window)
        run: dotnet build StarBlogPublisher.DesktopTests/StarBlogPublisher.DesktopTests.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: output/test-results
